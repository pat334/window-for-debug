name: windows-rdp-tailscale

on:
  workflow_dispatch:
    inputs:
      ts_authkey:
        description: 'Tailscale auth key'
        required: true
        type: string
      duration_minutes:
        description: 'Thời gian giữ session (phút, tối đa ~350)'
        required: false
        default: '340'
        type: string

jobs:
  rdp:
    runs-on: windows-latest
    timeout-minutes: 350
    steps:
      - name: Enable RDP + tạo user mywin
        shell: powershell
        run: |
          $user = "mywin"
          $pass = "Passw0rd!2026"

          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

          net user $user "$pass" /add
          if ($LASTEXITCODE -ne 0) {
              Write-Error "Tao user that bai"
              exit 1
          }

          net localgroup administrators $user /add
          net localgroup "Remote Desktop Users" $user /add

          # Tắt NLA để Guacamole (RDP mode thường) connect được
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0

          Write-Host "User da tao: $user"

      - name: Connect Tailscale (hostname cố định)
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ inputs.ts_authkey }}
          tags: tag:ci-rdp
          hostname: gha-windows-rdp

      - name: In ra Tailscale IP
        shell: powershell
        run: |
          $ip = tailscale ip -4
          Write-Host "Tailscale IP: $ip"
          Write-Host "Username: mywin"
          Write-Host "Password: Passw0rd!2026"
          Write-Host "RDP qua HTML5 (Guacamole): mở connection 'gha-windows-rdp' đã cấu hình sẵn, nhớ cập nhật IP moi nhat nay"

      - name: Keep alive
        shell: powershell
        run: |
          $minutes = [int]"${{ inputs.duration_minutes }}"
          $timeout = (Get-Date).AddMinutes($minutes)
          Write-Host "Session sẽ giữ tới: $timeout"
          while ((Get-Date) -lt $timeout) {
              Start-Sleep -Seconds 60
          }

      - name: Cleanup (rời tailnet)
        if: always()
        shell: powershell
        run: |
          tailscale logout
